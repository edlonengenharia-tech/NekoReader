<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MangaReader — Protótipo Web do Leitor</title>
<!--
  Protótipo interativo em HTML/JS puro que espelha a interface do app WinForms:
  painel central de páginas, barra inferior (primeira/anterior/próxima/última),
  modo mangá (RTL), página dupla, ajuste à largura/altura/página, tela cheia,
  animação de virada e persistência de posição via localStorage.

  As "páginas" são geradas por SVG inline (sem arquivos externos) — basta abrir
  este arquivo no navegador. Referência visual para o layout de Views/MainForm.cs.
-->
<style>
  :root{
    --bg:#18181c; --panel:#212127; --accent:#e63946; --fg:#eaeaea; --muted:#8a8a93;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--fg);font-family:"Segoe UI",system-ui,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}

  /* ---- Barra lateral (biblioteca ocultável — Tab no app) ---- */
  #sidebar{width:230px;background:var(--panel);border-right:1px solid #2e2e36;display:flex;flex-direction:column;transition:margin-left .25s ease}
  #sidebar.hidden{margin-left:-230px}
  #sidebar h2{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);padding:12px 14px 6px}
  #library{flex:1;overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px}
  .cover{aspect-ratio:2/3;border-radius:6px;cursor:pointer;outline:2px solid transparent;transition:transform .1s}
  .cover:hover{transform:scale(1.05)}
  .cover.sel{outline-color:var(--accent)}
  .cover span{display:block;font-size:9px;text-align:center;color:var(--muted);padding-top:2px}

  /* ---- Área central ---- */
  #main{flex:1;display:flex;flex-direction:column;min-width:0}
  #viewer{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;overflow:hidden;position:relative;background:#101013}
  #viewer.rtl{flex-direction:row-reverse}
  .page{background:#fff;border-radius:2px;box-shadow:0 4px 24px #000;max-height:96%;transition:filter .2s}
  .page svg{display:block;height:100%;width:auto}

  /* Animação de virada (espelha DrawFlipEffect do PagePanel.cs) */
  @keyframes flipR{from{transform:translateX(40px);opacity:.25}to{transform:none;opacity:1}}
  @keyframes flipL{from{transform:translateX(-40px);opacity:.25}to{transform:none;opacity:1}}
  .flip-next{animation:flipR .28s ease-out}
  .flip-prev{animation:flipL .28s ease-out}

  /* ---- Barra inferior ---- */
  #toolbar{display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--panel);border-top:1px solid #2e2e36;flex-wrap:wrap}
  button,select{background:#2b2b33;color:var(--fg);border:1px solid #3a3a44;border-radius:6px;padding:6px 10px;font-size:13px;cursor:pointer}
  button:hover{background:#34343e}
  button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  #pager{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
  #title{padding:8px 14px;font-size:13px;color:var(--muted);border-bottom:1px solid #2e2e36;background:var(--panel);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  kbd{background:#2b2b33;border-radius:4px;padding:1px 5px;font-size:11px;color:var(--muted)}

  /* Tela cheia (F / F11 — como no MainForm.cs) */
  body.full #sidebar,body.full #title,body.full #toolbar{display:none}
</style>
</head>
<body>
<div style="display:flex;flex:1;min-height:0">
  <aside id="sidebar">
    <h2>Biblioteca</h2>
    <div id="library"></div>
    <div style="padding:8px 12px;font-size:11px;color:var(--muted)">
      <kbd>Tab</kbd> oculta &nbsp; <kbd>←→</kbd> páginas<br>
      <kbd>F</kbd> tela cheia &nbsp; <kbd>D</kbd> dupla &nbsp; <kbd>M</kbd> mangá
    </div>
  </aside>

  <div id="main">
    <div id="title">Nenhum livro aberto</div>
    <div id="viewer"></div>
    <div id="toolbar">
      <button data-nav="first" title="Primeira página (Home)">⏮</button>
      <button data-nav="prev"  title="Anterior (← ou clique esq.)">◀</button>
      <button data-nav="next"  title="Próxima (→ ou clique dir.)">▶</button>
      <button data-nav="last"  title="Última página (End)">⏭</button>
      <button id="btnManga" title="Modo mangá RTL (M)">Mangá RTL</button>
      <button id="btnDouble" title="Página dupla (D)">Dupla</button>
      <select id="fit" title="Ajuste (W alterna)">
        <option value="width">Ajustar largura</option>
        <option value="height">Ajustar altura</option>
        <option value="page">Ajustar página</option>
        <option value="actual">100%</option>
      </select>
      <button id="btnFull" title="Tela cheia (F)">⛶</button>
      <span id="pager">– / –</span>
    </div>
  </div>
</div>

<script>
"use strict";
/* ---------- "Livros" de exemplo (SVG gerado — substituiria CBZ/PDF reais) ---------- */
const BOOKS = [
  {id:"op104", title:"One Piece — 104", pages:12, hue:205},
  {id:"nrr01", title:"Neko Reader — 01", pages:8,  hue:340},
  {id:"sci12", title:"Sci-Fi Weekly — 12", pages:10, hue:120},
];
function pageSVG(book, n){
  const h = book.hue, t = (n*37)%360;
  return `<svg viewBox="0 0 600 860" xmlns="http://www.w3.org/2000/svg">
    <rect width="600" height="860" fill="hsl(${h},30%,${88-(n%3)*2}%)"/>
    <rect x="20" y="20" width="560" height="120" rx="8" fill="hsl(${t},70%,55%)" opacity=".85"/>
    <text x="40" y="95" font-family="sans-serif" font-size="42" font-weight="bold" fill="#fff">${book.title}</text>
    ${[0,1,2].map(r=>`<rect x="20" y="${160+r*230}" width="${r===1?560:270}" height="${r===1?210:210}" rx="8"
        fill="hsl(${(t+r*40)%360},45%,${r===1?70:62}%)" stroke="#222" stroke-width="4"/>`).join("")}
    ${[0,1,2].map(r=>`<rect x="${r===1?300:20}" y="${160+(r===2?230:0)}" width="280" height="210" rx="8"
        fill="hsl(${(t+180+r*30)%360},40%,75%)" stroke="#222" stroke-width="4"/>`).join("")}
    <text x="560" y="840" text-anchor="end" font-family="sans-serif" font-size="28" fill="#333">${n+1}</text>
  </svg>`;
}

/* ---------- Estado (persistido como ReadingStateService.cs faz em JSON) ---------- */
const state = Object.assign({book:"op104", page:0, manga:false, double:false, fit:"width"},
  JSON.parse(localStorage.getItem("neko-web-state")||"{}"));
const save = () => localStorage.setItem("neko-web-state", JSON.stringify(state));
const book = () => BOOKS.find(b=>b.id===state.book);

/* ---------- Render ---------- */
const viewer=document.getElementById("viewer"), pager=document.getElementById("pager"),
      title=document.getElementById("title");
function render(dir){
  const b=book(), total=b.pages;
  state.page=Math.max(0,Math.min(total-1,state.page));
  // Página dupla no mangá: ordem física invertida igual a ReaderEngine (físico = total-1-exibição)
  const idx=[];
  if(state.double && state.page<total-1){ idx.push(state.page, state.page+1); }
  else idx.push(state.page);
  viewer.innerHTML="";
  viewer.classList.toggle("rtl", state.manga);
  idx.forEach((i,k)=>{
    const d=document.createElement("div");
    d.className="page "+(dir>0?"flip-next":dir<0?"flip-prev":"");
    d.innerHTML=pageSVG(b,i);
    sizePage(d);
    if(state.manga && idx.length===2 && k===0) d.style.order="2"; // maior índice à esquerda
    viewer.appendChild(d);
  });
  pager.textContent=`${state.page+1} / ${total}` + (state.double&&idx.length===2? " (dupla)":"");
  title.textContent=`📖 ${b.title} — ${Math.round((state.page+1)/total*100)}% lido`;
  document.getElementById("btnManga").classList.toggle("on",state.manga);
  document.getElementById("btnDouble").classList.toggle("on",state.double);
  document.getElementById("fit").value=state.fit;
  save();
}
function sizePage(el){
  const f=state.fit;
  el.style.height = f==="height" ? "96%" : "";
  el.style.width  = f==="width"  ? (state.double?"49%":"86%") : f==="actual" ? "600px" : "";
  if(f==="page"){ el.style.maxWidth="96%"; el.querySelector("svg").style.maxHeight="96vh"; }
}

/* ---------- Navegação (zonas de clique estilo CDisplayEx) ---------- */
function nav(delta){ if(delta>0 && state.double) state.page+=2; else if(delta<0 && state.double) state.page-=2; else state.page+=delta; render(delta>0?1:delta<0?-1:0); }
document.querySelectorAll("[data-nav]").forEach(btn=>btn.onclick=()=>{
  const n=btn.dataset.nav, total=book().pages;
  if(n==="first") state.page=0; else if(n==="last") state.page=total-1; else nav(n==="next"?1:-1);
  if(n==="first"||n==="last") render(0);
});
viewer.addEventListener("click",e=>{
  const x=e.clientX/innerWidth;
  const rtl=state.manga;
  if(rtl ? x<0.25 : x>0.75) nav(1);
  else if(rtl ? x>0.75 : x<0.25) nav(-1);
});

/* ---------- Toolbar / atalhos (mesmos do MainForm.cs) ---------- */
document.getElementById("btnManga").onclick =()=>{state.manga=!state.manga;render(0)};
document.getElementById("btnDouble").onclick=()=>{state.double=!state.double;render(0)};
document.getElementById("fit").onchange     =e=>{state.fit=e.target.value;render(0)};
document.getElementById("btnFull").onclick  =()=>toggleFull();
function toggleFull(){ document.body.classList.toggle("full"); render(0); }
addEventListener("keydown",e=>{
  if(e.key==="ArrowRight") nav(state.manga?-1:1);
  else if(e.key==="ArrowLeft") nav(state.manga?1:-1);
  else if(e.key==="Home"){state.page=0;render(0)}
  else if(e.key==="End"){state.page=book().pages-1;render(0)}
  else if(e.key.toLowerCase()==="m") document.getElementById("btnManga").click();
  else if(e.key.toLowerCase()==="d") document.getElementById("btnDouble").click();
  else if(e.key.toLowerCase()==="w"){const s=document.getElementById("fit");const o=["width","height","page","actual"];s.value=o[(o.indexOf(state.fit)+1)%4];s.onchange({target:s});}
  else if(e.key==="Tab"){e.preventDefault();document.getElementById("sidebar").classList.toggle("hidden")}
  else if(e.key==="f"||e.key==="F11"){e.preventDefault();toggleFull()}
  else if(e.key==="Escape"&&document.body.classList.contains("full")) toggleFull();
});

/* ---------- Biblioteca lateral ---------- */
const lib=document.getElementById("library");
BOOKS.forEach(b=>{
  const c=document.createElement("div");
  c.className="cover"+(b.id===state.book?" sel":"");
  c.innerHTML=`<svg viewBox="0 0 100 150" style="width:100%;height:calc(100% - 14px);border-radius:6px">
      <rect width="100" height="150" fill="hsl(${b.hue},60%,45%)"/>
      <text x="50" y="80" text-anchor="middle" font-size="10" fill="#fff" font-family="sans-serif">${b.pages}p</text></svg>
    <span>${b.title.split("—")[0]}</span>`;
  c.onclick=()=>{state.book=b.id;state.page=0;lib.querySelectorAll(".cover").forEach(x=>x.classList.remove("sel"));c.classList.add("sel");render(0)};
  lib.appendChild(c);
});
render(0);
</script>
</body>
</html>
